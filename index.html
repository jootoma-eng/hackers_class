<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TOEIC Easy~ | 영어 Master 주대명</title>

  <!-- 모던하고 부드러운 폰트 (Pretendard & Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <style>
    :root {
      --bg-page: #f5f5f7;
      --surface: #ffffff;
      --surface-subtle: #fbfbfd;
      --text-primary: #1d1d1f;
      --text-secondary: #6e6e73;
      --accent: #0071e3;
      --accent-soft: rgba(0, 113, 227, 0.08);
      --border: rgba(0, 0, 0, 0.08);
      --shadow-soft: 0 4px 20px rgba(0, 0, 0, 0.04);
      --shadow-float: 0 12px 32px rgba(0, 0, 0, 0.07);
      --radius-card: 28px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Pretendard", "Inter", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background-color: var(--bg-page);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.55;
      letter-spacing: -0.015em;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* 애플 스타일 반투명 상단 메뉴 */
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(245, 245, 247, 0.8);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid var(--border);
    }

    .nav-container {
      max-width: 960px;
      margin: 0 auto;
      padding: 12px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .nav-menu {
      list-style: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .nav-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 18px;
      border-radius: 980px;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-primary);
      background: var(--surface);
      border: 1px solid var(--border);
      transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease, transform 0.2s ease;
    }

    .nav-link:hover,
    .nav-link:focus-visible {
      background: var(--accent-soft);
      border-color: rgba(0, 113, 227, 0.28);
      color: var(--accent);
      transform: translateY(-1px);
    }

    /* 화면 중앙 메인 */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .hero-card {
      width: 100%;
      max-width: 540px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-float);
      padding: 44px 30px 38px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .main-title {
      font-size: clamp(2.1rem, 5vw, 2.85rem);
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.03em;
      line-height: 1.15;
    }

    .sub-slogan {
      margin-top: 8px;
      font-size: clamp(1.12rem, 2.6vw, 1.38rem);
      font-weight: 500;
      color: var(--text-secondary);
      letter-spacing: -0.02em;
    }

    .photo-frame {
      margin: 26px 0 22px;
      width: 224px;
      height: 224px;
      border-radius: 50%;
      background: linear-gradient(180deg, #f5f5f7 0%, #ffffff 100%);
      border: 1px solid var(--border);
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      box-shadow: var(--shadow-soft);
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
    }

    .teacher-name {
      display: inline-block;
      padding: 7px 18px;
      border-radius: 980px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: -0.015em;
    }

    /* 화면 하단 SNS 및 문의 링크 */
    footer {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-top: 1px solid var(--border);
      padding: 22px 20px 28px;
    }

    .footer-container {
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .social-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 18px;
      border-radius: 980px;
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 500;
      background: var(--surface);
      color: var(--text-primary);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-soft);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }

    .social-btn:hover,
    .social-btn:focus-visible {
      transform: translateY(-2px);
      box-shadow: var(--shadow-float);
      border-color: rgba(0, 113, 227, 0.3);
      color: var(--accent);
    }

    @media (max-width: 520px) {
      .nav-menu {
        width: 100%;
        flex-direction: column;
        gap: 8px;
      }

      .nav-link {
        width: 100%;
      }

      .hero-card {
        padding: 36px 22px 32px;
        border-radius: 24px;
      }

      .photo-frame {
        width: 196px;
        height: 196px;
      }

      .social-btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="nav-container">
      <nav aria-label="학습 메뉴">
        <ul class="nav-menu">
          <!-- (1) Daily Essential Sentences -->
          <li>

          <!-- (3) 영어 문법 정복(토익 Part 5,6) -->

      </nav>

  </header>

  <main>
    <section class="hero-card" aria-label="메인 소개">
      <h1 class="main-title">TOEIC Easy~</h1>
      <p class="sub-slogan">이런 게 토익이지~</p>

      <div class="photo-frame">
        <img src="remove_background_2.png" alt="영어 Master 주대명" />
      </div>

      <p class="teacher-name">영어 Master 주대명</p>
    </section>
  </main>

  <footer>
    <div class="footer-container">
      <a
        class="social-btn"
        href="https://www.youtube.com/@%EC%98%81%EC%96%B4%EC%A3%BC%EB%8C%80%EB%AA%85"
        target="_blank"
        rel="noopener noreferrer"
      >
        유튜브 채널 바로가기
      </a>

      <a
        class="social-btn"
        href="https://open.kakao.com/o/sDOcRqVe"
        target="_blank"
        rel="noopener noreferrer"
      >
        카카오톡 1:1 문의
      </a>

      <a
        class="social-btn"
        href="https://www.instagram.com/jootoma_1?jplx=dThtbjUyajd1d3pw&utm_source=qr"
        target="_blank"
        rel="noopener noreferrer"
      >
        인스타그램
      </a>
    </div>
  </footer>
</body>
</html>
