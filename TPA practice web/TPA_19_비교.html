<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TPA 19 비교 - 영어 문법 정복(토익 Part 5,6)</title>
  <style>
    :root {
      --bg-color: #f4f7fb;
      --card-bg: #ffffff;
      --primary: #1e3a8a;
      --primary-light: #eff6ff;
      --accent: #2563eb;
      --success: #16a34a;
      --success-light: #dcfce7;
      --danger: #dc2626;
      --danger-light: #fee2e2;
      --text-main: #111827;
      --text-sub: #4b5563;
      --border-color: #e5e7eb;
      --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 10px 24px rgba(37, 99, 235, 0.12);
      --radius-lg: 20px;
      --radius-md: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Malgun Gothic", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.65;
      padding: 20px 20px 72px;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
    }

    /* 상단 내비게이션 */
    .top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 12px 18px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 24px;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.92rem;
      font-weight: 700;
      text-decoration: none;
      background-color: var(--primary-light);
      color: var(--primary);
      border: 1px solid #bfdbfe;
      transition: all 0.18s ease;
    }

    .nav-btn:hover {
      background-color: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    .site-brand {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--primary);
    }

    /* 타이틀 및 강사 프로필 헤더 */
    .header-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 28px 24px;
      text-align: center;
      box-shadow: var(--shadow-sm);
      margin-bottom: 24px;
    }

    .lecture-tag {
      display: inline-block;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent);
      background: var(--primary-light);
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 10px;
    }

    .main-title {
      font-size: clamp(1.55rem, 3.2vw, 2.2rem);
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.02em;
      margin-bottom: 16px;
    }

    .instructor-mini {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 6px 14px 6px 6px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 999px;
    }

    .mini-photo {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1e3a8a, #3b82f6);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    .mini-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .mini-name {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-sub);
    }

    /* 난이도 선택 및 진행 현황 요약 바 */
    .progress-bar-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 14px 18px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-sm);
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--text-sub);
    }

    .level-switch {
      display: inline-flex;
      gap: 8px;
    }

    .level-btn {
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: var(--text-sub);
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .level-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    .stats-group {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    /* 복습 모드 안내 배너 */
    .mode-banner {
      display: none;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      background: var(--primary-light);
      border: 1px solid #93c5fd;
      color: var(--primary);
      padding: 14px 18px;
      border-radius: var(--radius-md);
      margin-bottom: 20px;
      font-weight: 700;
    }

    .mode-banner.active {
      display: flex;
    }

    .reset-all-btn {
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--accent);
      background: #ffffff;
      color: var(--accent);
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .reset-all-btn:hover {
      background: var(--accent);
      color: #ffffff;
    }

    /* 문제 카드 */
    .question-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 20px;
      transition: border-color 0.2s ease;
    }

    .question-card.solved-correct {
      border-color: #86efac;
    }

    .question-card.solved-wrong {
      border-color: #fca5a5;
    }

    .question-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .q-number {
      font-size: 1rem;
      font-weight: 800;
      color: var(--primary);
    }

    /* 녹색불 3개 */
    .life-indicator {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 6px 12px;
      border-radius: 999px;
    }

    .life-label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-sub);
    }

    .green-lights {
      display: inline-flex;
      gap: 6px;
    }

    .green-light {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background-color: #22c55e;
      box-shadow: 0 0 8px rgba(34, 197, 94, 0.75);
      transition: all 0.25s ease;
    }

    .green-light.off {
      background-color: #d1d5db;
      box-shadow: none;
    }

    .question-text {
      font-size: 1.08rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 18px;
      line-height: 1.75;
    }

    /* 4지선다 보기 */
    .options-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .option-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      text-align: left;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1.5px solid var(--border-color);
      background-color: #ffffff;
      color: var(--text-main);
      font-size: 0.98rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.16s ease;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--accent);
      background-color: var(--primary-light);
      transform: translateY(-1px);
    }

    .option-btn:disabled {
      cursor: default;
      opacity: 0.72;
    }

    .option-btn.correct-choice {
      border-color: var(--success);
      background-color: var(--success-light);
      color: #14532d;
      opacity: 1;
    }

    .option-btn.wrong-choice {
      border-color: var(--danger);
      background-color: var(--danger-light);
      color: #7f1d1d;
      opacity: 1;
    }

    .opt-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #f1f5f9;
      color: var(--text-sub);
      font-size: 0.82rem;
      font-weight: 800;
      flex-shrink: 0;
    }

    /* 피드백 및 해설 영역 */
    .feedback-box {
      display: none;
      margin-top: 16px;
      padding: 16px 18px;
      border-radius: 12px;
      animation: fadeIn 0.22s ease;
    }

    .feedback-box.show {
      display: block;
    }

    .feedback-box.wrong-msg {
      background-color: var(--danger-light);
      border: 1px solid #fca5a5;
      color: #991b1b;
      font-weight: 700;
    }

    .feedback-box.correct-msg {
      background-color: var(--success-light);
      border: 1px solid #86efac;
      color: #14532d;
    }

    .feedback-box.exhausted-msg {
      background-color: #fff1f2;
      border: 1px solid #fda4af;
      color: #881337;
    }

    .feedback-title {
      font-size: 1.05rem;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .answer-line {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .translation-line {
      font-size: 0.93rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .explanation-text {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text-main);
      line-height: 1.65;
    }

    /* 테스트 완료 결과 섹션 */
    .result-section {
      display: none;
      background: var(--card-bg);
      border: 2px solid var(--accent);
      border-radius: var(--radius-lg);
      padding: 32px 24px;
      box-shadow: var(--shadow-md);
      margin-top: 32px;
      text-align: center;
    }

    .result-section.show {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    .result-heading {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 24px;
    }

    .chart-and-stats {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 36px;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }

    .donut-chart {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.1);
    }

    .donut-chart::before {
      content: "";
      width: 122px;
      height: 122px;
      border-radius: 50%;
      background: #ffffff;
      position: absolute;
    }

    .donut-center {
      position: relative;
      z-index: 1;
      text-align: center;
    }

    .donut-percent {
      display: block;
      font-size: 1.7rem;
      font-weight: 800;
      color: var(--primary);
      line-height: 1.1;
    }

    .donut-sub {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-sub);
    }

    .rate-legend {
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1rem;
      font-weight: 700;
    }

    .dot-correct {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background-color: #22c55e;
      display: inline-block;
    }

    .dot-wrong {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background-color: #ef4444;
      display: inline-block;
    }

    .retry-options {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 32px;
      padding-bottom: 28px;
      border-bottom: 1px solid var(--border-color);
    }

    .retry-btn {
      padding: 12px 20px;
      border-radius: 12px;
      border: 1.5px solid var(--accent);
      background-color: var(--primary-light);
      color: var(--primary);
      font-size: 0.96rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .retry-btn:hover {
      background-color: var(--accent);
      color: #ffffff;
    }

    .hard-challenge-box {
      max-width: 620px;
      margin: 0 auto;
    }

    .hard-question {
      font-size: 1.12rem;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 16px;
    }

    .hard-btns {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }

    .yes-btn {
      padding: 11px 28px;
      border-radius: 10px;
      border: none;
      background-color: var(--accent);
      color: #ffffff;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      transition: background-color 0.18s ease;
    }

    .yes-btn:hover {
      background-color: var(--primary);
    }

    .no-btn {
      padding: 11px 28px;
      border-radius: 10px;
      border: 1.5px solid #cbd5e1;
      background-color: #ffffff;
      color: var(--text-sub);
      font-size: 1rem;
      font-weight: 800;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.18s ease;
    }

    .no-btn:hover {
      border-color: var(--text-main);
      color: var(--text-main);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 640px) {
      .options-grid {
        grid-template-columns: 1fr;
      }

      .question-card {
        padding: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 상단 내비게이션 -->
    <header class="top-nav">
      <div class="nav-left">
        <a class="nav-btn" href="../index.html">← 메인으로</a>
        <a class="nav-btn" href="../TPA_practice_main.html">강의목록으로</a>
      </div>
      <span class="site-brand">English Easy~!</span>
    </header>

    <!-- 제목 및 강사 정보 -->
    <section class="header-card">
      <span id="lectureTag" class="lecture-tag">TPA 19 · 비교 (기본 A · 총 41문항)</span>
      <h1 class="main-title">영어 문법 정복(토익 Part 5,6)</h1>
      <div class="instructor-mini">
        <div class="mini-photo" title="영어 Master 주대명">
          <img
            src="remove_background_2.png"
            alt="영어 Master 주대명"
            onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"
          />
          <svg style="display:none;" width="22" height="22" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle cx="32" cy="22" r="11" fill="#FFFFFF"/>
            <path d="M12 52C12 42.0589 20.0589 34 30 34H34C43.9411 34 52 42.0589 52 52V54H12V52Z" fill="#FFFFFF"/>
          </svg>
        </div>
        <span class="mini-name">영어 Master 주대명</span>
      </div>
    </section>

    <!-- 난이도 전환 및 진행 현황 요약 -->
    <div class="progress-bar-card">
      <div class="level-switch">
        <button type="button" id="btnEasy" class="level-btn active" onclick="switchLevel('easy')">기본 (A)</button>
        <button type="button" id="btnHard" class="level-btn" onclick="switchLevel('hard')">고난도 (B)</button>
      </div>
      <div class="stats-group">
        <span id="solvedProgressText">완료 문항: 0 / 41</span>
        <span id="currentScoreText">현재 정답: 0 / 0</span>
      </div>
    </div>

    <!-- 복습 모드 알림 배너 -->
    <div id="modeBanner" class="mode-banner">
      <span id="modeBannerText">복습 모드</span>
      <button type="button" class="reset-all-btn" onclick="showAllQuestions()">전체 문항 보기</button>
    </div>

    <!-- 문제 영역 -->
    <main id="quizContainer"></main>

    <!-- 테스트 완료 결과 및 복습 / 고난도 도전 섹션 -->
    <section id="resultSection" class="result-section" aria-live="polite">
      <h2 class="result-heading">테스트 완료! 전체 문항 대비 정답률</h2>

      <div class="chart-and-stats">
        <div id="donutChart" class="donut-chart">
          <div class="donut-center">
            <span id="donutPercent" class="donut-percent">0%</span>
            <span class="donut-sub">정답률</span>
          </div>
        </div>

        <div class="rate-legend">
          <div class="legend-item">
            <span class="dot-correct"></span>
            <span id="correctRateText">정답률: 0% (0/41)</span>
          </div>
          <div class="legend-item">
            <span class="dot-wrong"></span>
            <span id="wrongRateText">오답률: 0% (0/41)</span>
          </div>
        </div>
      </div>

      <div class="retry-options">
        <button type="button" class="retry-btn" onclick="retryWrongQuestions()">틀린 문제 다시 풀기</button>
        <button type="button" class="retry-btn" onclick="retryNotFirstTryQuestions()">1차 시도에서 맞히지 못 한 문제 다시 풀기</button>
      </div>

      <div id="hardChallengeBox" class="hard-challenge-box">
        <p class="hard-question">더 어려운 문제에 도전하시겠습니까?</p>
        <div class="hard-btns">
          <button type="button" class="yes-btn" onclick="handleHardYes()">yes</button>
          <a class="no-btn" href="index.html">no</a>
        </div>
      </div>
    </section>
  </div>

  <script>
    const questionSets = {
      easy: [
        {
          id: 101,
          question: "The project was ------- difficult than we thought.",
          options: ["difficult", "very difficult", "difficulty", "more difficult"],
          answerIndex: 3,
          translation: "이 프로젝트는 우리가 생각했던 것보다 더 힘들다.",
          explanation: "be동사 뒤 보어 자리이며 뒤에 than이 있으므로 형용사의 비교급 more difficult가 정답입니다."
        },
        {
          id: 102,
          question: "This software is much easier ------- the current one we have.",
          options: ["that", "because", "than", "which"],
          answerIndex: 2,
          translation: "이 소프트웨어는 우리가 갖고 있는 현재 것보다 훨씬 쉽다.",
          explanation: "앞에 비교급 easier가 있으므로 비교 대상을 이끄는 than이 정답입니다."
        },
        {
          id: 103,
          question: "Our magazine provides you with ------- trends in the financial areas.",
          options: ["late", "lately", "the latest", "later"],
          answerIndex: 2,
          translation: "저희 잡지는 금융 분야의 최신 트렌드를 제공합니다.",
          explanation: "in the financial areas라는 영역 범위와 함께 '최신의'를 나타내는 최상급 the latest가 정답입니다."
        },
        {
          id: 104,
          question: "During this special offer, you can purchase our fine products at a much ------- price.",
          options: ["low", "lower", "lowest", "the lowest"],
          answerIndex: 1,
          translation: "이번 특별 할인 기간에 여러분은 저희 우수한 제품을 매우 저렴한 가격에 구입할 수 있습니다.",
          explanation: "앞에 비교급 강조 부사 much가 있으므로 형용사의 비교급 lower가 정답입니다."
        },
        {
          id: 105,
          question: "Employees of Gaia Furniture work ------- than those of SIC Manufacturing.",
          options: ["efficient", "more efficient", "efficiently", "more efficiently"],
          answerIndex: 3,
          translation: "가이아 퍼니처 직원들은 SIC 매뉴팩처링 직원들보다 더 효율적으로 일한다.",
          explanation: "자동사 work를 수식하는 부사 자리이며 than이 있으므로 부사의 비교급 more efficiently가 정답입니다."
        },
        {
          id: 106,
          question: "Mr. Lee's proposal seems to have ------- chances to be chosen than mine.",
          options: ["many", "much", "more", "most"],

    let currentLevel = "easy";
    const state = {
      easy: {},
      hard: {}
    };
    let visibleQuestionIds = [];

    function initLevelState(level) {
      questionSets[level].forEach((q) => {
        state[level][q.id] = {
          attempts: 0,
          status: "unsolved",
          firstTryCorrect: null,
          selectedWrongIndices: []
        };
      });
    }

    function resetQuestionState(level, qId) {
      state[level][qId] = {
        attempts: 0,
        status: "unsolved",
        firstTryCorrect: null,
        selectedWrongIndices: []
      };
    }

    function getQuestions() {
      return questionSets[currentLevel];
    }

    function getLevelState() {
      return state[currentLevel];
    }

    function switchLevel(level) {
      currentLevel = level;
      visibleQuestionIds = getQuestions().map((q) => q.id);

      document.getElementById("btnEasy").classList.toggle("active", level === "easy");
      document.getElementById("btnHard").classList.toggle("active", level === "hard");
      document.getElementById("lectureTag").textContent =
        level === "easy"
          ? "TPA 19 · 비교 (기본 A · 총 41문항)"
          : "TPA 19 · 비교 (고난도 B · 총 41문항)";

      document.getElementById("modeBanner").classList.remove("active");
      renderQuestions();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function updateProgressBar() {
      const qs = getQuestions();
      const stMap = getLevelState();
      const solvedCount = qs.filter((q) => stMap[q.id].status !== "unsolved").length;
      const correctCount = qs.filter((q) => stMap[q.id].status === "correct").length;
      document.getElementById("solvedProgressText").textContent = `완료 문항: ${solvedCount} / ${qs.length}`;
      document.getElementById("currentScoreText").textContent = `현재 정답: ${correctCount} / ${solvedCount}`;
    }

    function renderQuestions() {
      const container = document.getElementById("quizContainer");
      container.innerHTML = "";

      const qs = getQuestions();
      const stMap = getLevelState();
      const listToShow = qs.filter((q) => visibleQuestionIds.includes(q.id));

      listToShow.forEach((q, idx) => {
        const st = stMap[q.id];
        const remainingLives = Math.max(0, 3 - st.attempts);
        const isLocked = st.status !== "unsolved";

        const card = document.createElement("article");
        card.className = "question-card";
        if (st.status === "correct") card.classList.add("solved-correct");
        if (st.status === "wrong") card.classList.add("solved-wrong");
        card.id = `q-card-${q.id}`;

        const lightsHtml = [0, 1, 2]
          .map((i) => `<span class="green-light ${i >= remainingLives ? "off" : ""}"></span>`)
          .join("");

        const optionLabels = ["A", "B", "C", "D"];
        const optionsHtml = q.options
          .map((opt, optIdx) => {
            let btnClass = "option-btn";
            if (st.selectedWrongIndices.includes(optIdx)) {
              btnClass += " wrong-choice";
            }
            if ((st.status === "correct" || st.status === "wrong") && optIdx === q.answerIndex) {
              btnClass += " correct-choice";
            }

            const disabledAttr = isLocked || st.selectedWrongIndices.includes(optIdx) ? "disabled" : "";
            return `
              <button type="button" class="${btnClass}" ${disabledAttr} onclick="handleSelectOption(${q.id}, ${optIdx})">
                <span class="opt-badge">${optionLabels[optIdx]}</span>
                <span>${opt}</span>
              </button>
            `;
          })
          .join("");

        let feedbackHtml = "";
        if (st.status === "correct") {
          feedbackHtml = `
            <div class="feedback-box show correct-msg">
              <div class="feedback-title">정답입니다~ 짝짝짝!</div>
              <div class="answer-line">정답: (${optionLabels[q.answerIndex]}) ${q.options[q.answerIndex]}</div>
              <p class="translation-line">해석: ${q.translation}</p>
              <p class="explanation-text">해설: ${q.explanation}</p>
            </div>
          `;
        } else if (st.status === "wrong") {
          feedbackHtml = `
            <div class="feedback-box show exhausted-msg">
              <div class="feedback-title">3번의 시도를 모두 사용했습니다. (오답 처리)</div>
              <div class="answer-line">정답: (${optionLabels[q.answerIndex]}) ${q.options[q.answerIndex]}</div>
              <p class="translation-line">해석: ${q.translation}</p>
              <p class="explanation-text">해설: ${q.explanation}</p>
            </div>
          `;
        } else if (st.attempts > 0) {
          feedbackHtml = `
            <div class="feedback-box show wrong-msg">
              <div class="feedback-title">Oops~ 다시 시도해 보세요! (남은 기회: ${remainingLives}회)</div>
            </div>
          `;
        }

        card.innerHTML = `
          <div class="question-top">
            <span class="q-number">${q.id}. (${idx + 1}/${listToShow.length})</span>
            <div class="life-indicator" title="최대 3번까지 도전할 수 있습니다.">
              <span class="life-label">도전 기회</span>
              <div class="green-lights">${lightsHtml}</div>
            </div>
          </div>
          <p class="question-text">${q.question}</p>
          <div class="options-grid">${optionsHtml}</div>
          ${feedbackHtml}
        `;

        container.appendChild(card);
      });

      updateProgressBar();
      updateResultSection();
    }

    function handleSelectOption(qId, optIdx) {
      const qs = getQuestions();
      const stMap = getLevelState();
      const q = qs.find((item) => item.id === qId);
      const st = stMap[qId];
      if (!q || st.status !== "unsolved") return;
      if (st.selectedWrongIndices.includes(optIdx)) return;

      st.attempts += 1;

      if (optIdx === q.answerIndex) {
        st.status = "correct";
        if (st.attempts === 1) {
          st.firstTryCorrect = true;
        } else if (st.firstTryCorrect === null) {
          st.firstTryCorrect = false;
        }
      } else {
        if (st.attempts === 1) {
          st.firstTryCorrect = false;
        }
        st.selectedWrongIndices.push(optIdx);

        if (st.attempts >= 3) {
          st.status = "wrong";
        }
      }

      renderQuestions();
    }

    function updateResultSection() {
      const resultSection = document.getElementById("resultSection");
      const qs = getQuestions();
      const stMap = getLevelState();
      const allSolved = qs.every((q) => stMap[q.id].status !== "unsolved");

      if (!allSolved) {
        resultSection.classList.remove("show");
        return;
      }

      const total = qs.length;
      const correctCount = qs.filter((q) => stMap[q.id].status === "correct").length;
      const wrongCount = total - correctCount;

      const correctRate = Math.round((correctCount / total) * 100);
      const wrongRate = 100 - correctRate;

      const donut = document.getElementById("donutChart");
      donut.style.background = `conic-gradient(#22c55e 0% ${correctRate}%, #ef4444 ${correctRate}% 100%)`;

      document.getElementById("donutPercent").textContent = `${correctRate}%`;
      document.getElementById("correctRateText").textContent = `정답률: ${correctRate}% (${correctCount}/${total}문항)`;
      document.getElementById("wrongRateText").textContent = `오답률: ${wrongRate}% (${wrongCount}/${total}문항)`;

      const hardChallengeBox = document.getElementById("hardChallengeBox");
      hardChallengeBox.style.display = currentLevel === "easy" ? "block" : "none";

      resultSection.classList.add("show");
    }

    function retryWrongQuestions() {
      const qs = getQuestions();
      const stMap = getLevelState();
      const wrongIds = qs
        .filter((q) => stMap[q.id].status === "wrong")
        .map((q) => q.id);

      if (wrongIds.length === 0) {
        alert("틀린 문제가 없습니다! 모든 문제를 맞히셨어요.");
        return;
      }

      wrongIds.forEach((id) => resetQuestionState(currentLevel, id));
      visibleQuestionIds = wrongIds;

      const banner = document.getElementById("modeBanner");
      document.getElementById("modeBannerText").textContent = `틀린 문제 다시 풀기 (${wrongIds.length}문항)`;
      banner.classList.add("active");

      renderQuestions();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function retryNotFirstTryQuestions() {
      const qs = getQuestions();
      const stMap = getLevelState();
      const targetIds = qs
        .filter((q) => stMap[q.id].firstTryCorrect === false)
        .map((q) => q.id);

      if (targetIds.length === 0) {
        alert("1차 시도에서 모두 맞히셨습니다!");
        return;
      }

      targetIds.forEach((id) => resetQuestionState(currentLevel, id));
      visibleQuestionIds = targetIds;

      const banner = document.getElementById("modeBanner");
      document.getElementById("modeBannerText").textContent = `1차 시도에서 맞히지 못 한 문제 다시 풀기 (${targetIds.length}문항)`;
      banner.classList.add("active");

      renderQuestions();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function showAllQuestions() {
      visibleQuestionIds = getQuestions().map((q) => q.id);
      document.getElementById("modeBanner").classList.remove("active");
      renderQuestions();
    }

    function handleHardYes() {
      switchLevel("hard");
    }

    initLevelState("easy");
    initLevelState("hard");
    visibleQuestionIds = questionSets.easy.map((q) => q.id);
    renderQuestions();
  </script>
</body>
</html>
