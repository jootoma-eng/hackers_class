<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Essential Sentences - Course D Day 4</title>
    <style>
        :root {
            --bg-page: #f5f5f7;
            --bg-card: #ffffff;
            --text-primary: #1d1d1f;
            --text-secondary: #6e6e73;
            --accent-blue: #0071e3;
            --accent-blue-hover: #0077ed;
            --border-subtle: rgba(0, 0, 0, 0.08);
            --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.06);
            --font-sans: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Apple SD Gothic Neo', 'Segoe UI', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-page);
            color: var(--text-primary);
            margin: 0;
            padding: 32px 20px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            letter-spacing: -0.02em;
        }

        button, input, textarea, select {
            font-family: var(--font-sans);
            letter-spacing: -0.02em;
        }

        .page-wrapper {
            width: 100%;
            max-width: 760px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 상단 3개 메뉴/제목 나란히 배치 */
        .top-title-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .title-chip {
            background-color: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border-subtle);
            padding: 8px 16px;
            border-radius: 999px;
            font-size: 0.94rem;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .title-chip.primary {
            background-color: var(--text-primary);
            color: #ffffff;
            border-color: var(--text-primary);
            font-weight: 700;
        }

        /* 강사 소개 배지 */
        .instructor-pill {
            display: inline-flex;
            align-items: center;
            gap: 16px;
            background-color: var(--bg-card);
            padding: 12px 28px 12px 14px;
            border-radius: 999px;
            border: 1px solid var(--border-subtle);
            box-shadow: var(--shadow-soft);
            margin-bottom: 18px;
        }

        .instructor-avatar-ring {
            width: 74px;
            height: 74px;
            border-radius: 50%;
            padding: 3px;
            background-color: #ffffff;
            border: 2.5px solid #2b7de9;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }

        .instructor-photo {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            object-position: center top;
            background-color: #f0f4f9;
        }

        .instructor-meta {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-align: left;
            line-height: 1.22;
        }

        .instructor-role {
            font-size: 1.05rem;
            font-weight: 600;
            color: #2b7de9;
            margin-bottom: 2px;
        }

        .instructor-name {
            font-size: 1.55rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        /* 활기찬 응원 문구 카드 */
        .motto-card {
            width: 100%;
            background-color: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 28px;
            padding: 22px 28px;
            box-shadow: var(--shadow-soft);
            text-align: center;
            margin-bottom: 22px;
        }

        .motto-highlight {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--accent-blue);
            margin-bottom: 8px;
        }

        .motto-sub {
            font-size: 1.08rem;
            font-weight: 600;
            color: #3a3a3c;
            line-height: 1.6;
            white-space: pre-line;
        }

        /* 메인 학습 카드 */
        .card-container {
            width: 100%;
            background-color: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 28px;
            padding: 32px 36px;
            box-shadow: var(--shadow-soft);
            text-align: center;
        }

        .counter {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 14px;
        }

        .sentence-box {
            min-height: 132px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-bottom: 14px;
            cursor: pointer;
            padding: 18px 20px;
            border-radius: 20px;
            background-color: #fafafa;
            border: 1px solid rgba(0, 0, 0, 0.04);
            transition: background-color 0.2s ease, transform 0.12s ease;
        }

        .sentence-box:hover {
            background-color: #f3f6fa;
        }

        .sentence-box:active {
            transform: scale(0.992);
        }

        .sentence {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 10px;
            word-break: keep-all;
            line-height: 1.4;
        }

        .translation {
            font-size: 1.06rem;
            font-weight: 500;
            color: var(--text-secondary);
            word-break: keep-all;
            line-height: 1.45;
        }

        /* 문장 감추기 상태 */
        .hidden-text .sentence {
            color: transparent;
            text-shadow: 0 0 14px rgba(29, 29, 31, 0.28);
            user-select: none;
        }

        .hidden-text .translation {
            color: transparent;
            text-shadow: 0 0 12px rgba(110, 110, 115, 0.24);
            user-select: none;
        }

        .status-text {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--accent-blue);
            min-height: 22px;
            margin-bottom: 10px;
        }

        /* 하단 옵션 메뉴 (문장 보이기/감추기 + 3번 반복 재생 나란히 배치) */
        .option-menu {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .hide-btn {
            background-color: #f5f5f7;
            color: var(--text-primary);
            border: 1px solid rgba(0, 0, 0, 0.1);
            padding: 10px 20px;
            border-radius: 999px;
            font-size: 0.94rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .hide-btn:hover {
            background-color: #e8e8ed;
        }

        .hide-btn.active {
            background-color: var(--text-primary);
            color: #ffffff;
            border-color: var(--text-primary);
        }

        .audio-btn {
            background-color: rgba(0, 113, 227, 0.1);
            color: var(--accent-blue);
            border: 1px solid rgba(0, 113, 227, 0.22);
            padding: 10px 20px;
            border-radius: 999px;
            font-size: 0.94rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, color 0.2s ease, transform 0.1s ease;
        }

        .audio-btn:hover {
            background-color: rgba(0, 113, 227, 0.16);
        }

        .audio-btn:active {
            transform: scale(0.97);
        }

        .audio-btn.playing {
            background-color: var(--accent-blue);
            color: #ffffff;
            border-color: var(--accent-blue);
        }

        /* 하단 이전/이후 화살표 컨트롤 영역 */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 26px;
            gap: 12px;
        }

        .nav-btn {
            background-color: var(--accent-blue);
            color: #ffffff;
            border: none;
            padding: 12px 26px;
            border-radius: 999px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            line-height: 1;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .nav-btn:hover:not(:disabled) {
            background-color: var(--accent-blue-hover);
        }

        .nav-btn:active:not(:disabled) {
            transform: scale(0.96);
        }

        .nav-btn:disabled {
            background-color: #d2d2d7;
            color: #ffffff;
            cursor: not-allowed;
        }

        /* 화면 맨 아래 안내 문구 */
        p.footer-guide {
            color: var(--text-secondary);
            margin-top: 24px;
            margin-bottom: 0;
            font-size: 0.85rem;
            font-weight: 500;
            text-align: center;
            line-height: 1.5;
        }

        @media (max-width: 768px) {
            body {
                padding: 24px 16px 36px;
            }

            .card-container {
                padding: 24px 18px;
                border-radius: 24px;
            }

            .motto-card {
                padding: 18px 20px;
                border-radius: 24px;
            }

            .instructor-pill {
                padding: 10px 22px 10px 12px;
                gap: 14px;
            }

            .instructor-avatar-ring {
                width: 64px;
                height: 64px;
            }

            .instructor-name {
                font-size: 1.35rem;
            }

            .sentence {
                font-size: 1.25rem;
            }

            .nav-btn {
                padding: 11px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <div class="top-title-row">
            <span class="title-chip primary">Daily Essential Sentences</span>
            <span class="title-chip">Course D</span>
            <span class="title-chip">Day 4</span>
        </div>

        <div class="instructor-pill">
            <div class="instructor-avatar-ring">
                <img src="remove_background.png" alt="영어 Master 주대명" class="instructor-photo">
            </div>
            <div class="instructor-meta">
                <span class="instructor-role">영어 Master</span>
                <span class="instructor-name">주대명</span>
            </div>
        </div>

        <div class="motto-card">
            <div class="motto-highlight">하루 10문장만!</div>
            <div class="motto-sub">오늘도 입이 트인다! 큰 소리로 시원하게 따라 읽으세요! 🔥
읽고 또 읽고~ 내 영어가 살아난다! Go Go Go~!!</div>
        </div>

        <div class="card-container">
            <div class="counter" id="counter">1 / 10</div>

            <div class="sentence-box hidden-text" id="sentenceBox" onclick="playAudio(1)">
                <div class="sentence" id="sentenceText">학습 문장을 불러오는 중입니다.</div>
                <div class="translation" id="translationText">해석 영역</div>
            </div>

            <div class="status-text" id="statusText"></div>

            <div class="option-menu">
                <button type="button" class="hide-btn active" id="hideToggleBtn" onclick="toggleHideMode()">문장 보이기</button>
                <button type="button" class="audio-btn" id="playRepeatBtn" onclick="playAudio(3)">3번 반복 재생</button>
            </div>

            <div class="controls">
                <button type="button" class="nav-btn" id="prevBtn" onclick="changeSentence(-1)" aria-label="이전 문장">◀</button>
                <button type="button" class="nav-btn" id="nextBtn" onclick="changeSentence(1)" aria-label="이후 문장">▶</button>
            </div>
        </div>

        <p class="footer-guide">문장 영역을 터치하면 1번 재생됩니다. 아래 메뉴에서 문장 보기/감추기와 3번 반복 재생을 선택해 보세요.</p>
    </div>

    <audio id="audioPlayer" preload="auto"></audio>

    <script>
        // Course D Day 4 학습 문장 데이터
        // 1번 문장 skipSeconds: 0.9, 6번 문장 skipSeconds: 1.2, 나머지 기본 1.0
        const sentences = [
            {
                en: "Guests are given a complimentary light breakfast.",
                ko: "투숙객에게는 간단한 무료 조식이 제공됩니다.",
                audio: "daily essential-331.mp3",
                skipSeconds: 0.9
            },
            {
                en: "The cost of living has dramatically increased.",
                ko: "생활비가 급격하게 상승했습니다.",
                audio: "daily essential-332.mp3",
                skipSeconds: 1.0
            },
            {
                en: "Starting a business is costly.",
                ko: "창업하는 데에는 많은 비용이 듭니다.",
                audio: "daily essential-333.mp3",
                skipSeconds: 1.0
            },
            {
                en: "The seminar was cancelled due to marginal interest.",
                ko: "관심이 저조하여 그 세미나는 취소되었습니다.",
                audio: "daily essential-334.mp3",
                skipSeconds: 1.0
            },
            {
                en: "The exercise gear is aimed at teenagers.",
                ko: "그 운동기구는 십 대 청소년들을 겨냥한 제품입니다.",
                audio: "daily essential-335.mp3",
                skipSeconds: 1.0
            },
            {
                en: "Please take advantage of this opportunity.",
                ko: "이 기회를 꼭 잘 활용하시기 바랍니다.",
                audio: "daily essential-336.mp3",
                skipSeconds: 1.2
            },
            {
                en: "All inquiries should be forwarded to the manager.",
                ko: "모든 문의 사항은 매니저에게 전달되어야 합니다.",
                audio: "daily essential-337.mp3",
                skipSeconds: 1.0
            },
            {
                en: "The new mobile phone has been favorably received.",
                ko: "새로 출시된 휴대폰이 좋은 반응을 얻고 있습니다.",
                audio: "daily essential-338.mp3",
                skipSeconds: 1.0
            },
            {
                en: "Economic wealth is not evenly distributed.",
                ko: "경제적 부가 고르게 분배되어 있지 않습니다.",
                audio: "daily essential-339.mp3",
                skipSeconds: 1.0
            },
            {
                en: "We need to raise awareness of environmental issues.",
                ko: "환경 문제에 대한 인식을 높일 필요가 있습니다.",
                audio: "daily essential-340.mp3",
                skipSeconds: 1.0
            }
        ];

        let currentIndex = 0;
        let isHideMode = true; // true: 문장 감춘 상태, false: 문장 보인 상태
        let remainingRepeats = 0;
        let isPlaying = false;

        const audioPlayer = document.getElementById("audioPlayer");
        const counterEl = document.getElementById("counter");
        const sentenceBoxEl = document.getElementById("sentenceBox");
        const sentenceTextEl = document.getElementById("sentenceText");
        const translationTextEl = document.getElementById("translationText");
        const playRepeatBtn = document.getElementById("playRepeatBtn");
        const hideToggleBtn = document.getElementById("hideToggleBtn");
        const statusTextEl = document.getElementById("statusText");
        const prevBtn = document.getElementById("prevBtn");
        const nextBtn = document.getElementById("nextBtn");

        function syncVisibilityUI() {
            if (isHideMode) {
                sentenceBoxEl.classList.add("hidden-text");
                hideToggleBtn.textContent = "문장 보이기";
                hideToggleBtn.classList.add("active");
            } else {
                sentenceBoxEl.classList.remove("hidden-text");
                hideToggleBtn.textContent = "문장 감추기";
                hideToggleBtn.classList.remove("active");
            }
        }

        function stopAudio() {
            remainingRepeats = 0;
            isPlaying = false;
            audioPlayer.pause();
            playRepeatBtn.classList.remove("playing");
            statusTextEl.textContent = "";
        }

        function renderSentence(autoPlayOnce = false) {
            stopAudio();
            const item = sentences[currentIndex];
            counterEl.textContent = `${currentIndex + 1} / ${sentences.length}`;
            sentenceTextEl.textContent = item.en;
            translationTextEl.textContent = item.ko;

            syncVisibilityUI();

            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === sentences.length - 1;

            if (autoPlayOnce) {
                playAudio(1);
            }
        }

        function startSinglePass(item) {
            const skip = Math.max(0, Number(item.skipSeconds) || 0);

            const beginPlayback = () => {
                if (skip > 0) {
                    try {
                        if (!audioPlayer.duration || skip < audioPlayer.duration) {
                            audioPlayer.currentTime = skip;
                        }
                    } catch (_) {}
                }
                audioPlayer.play().catch((err) => {
                    console.error("오디오 재생 실패:", err);
                    statusTextEl.textContent = "음성 재생이 차단되었거나 파일을 찾을 수 없습니다.";
                    isPlaying = false;
                    playRepeatBtn.classList.remove("playing");
                });
            };

            if (audioPlayer.readyState >= 1) {
                beginPlayback();
            } else {
                const onCanPlay = () => {
                    audioPlayer.removeEventListener("canplay", onCanPlay);
                    audioPlayer.removeEventListener("loadedmetadata", onCanPlay);
                    beginPlayback();
                };
                audioPlayer.addEventListener("canplay", onCanPlay);
                audioPlayer.addEventListener("loadedmetadata", onCanPlay);
                audioPlayer.load();
            }
        }

        function playAudio(times) {
            const item = sentences[currentIndex];
            if (!item || !item.audio) return;

            stopAudio();
            isPlaying = true;
            remainingRepeats = times;

            if (times === 1) {
                statusTextEl.textContent = "1번 재생 중...";
            } else {
                playRepeatBtn.classList.add("playing");
                statusTextEl.textContent = `3번 반복 재생 중 (남은 횟수: ${remainingRepeats}회)`;
            }

            audioPlayer.src = item.audio;
            startSinglePass(item);
        }

        audioPlayer.addEventListener("ended", () => {
            if (!isPlaying) return;
            remainingRepeats -= 1;

            if (remainingRepeats > 0) {
                const item = sentences[currentIndex];
                statusTextEl.textContent = `3번 반복 재생 중 (남은 횟수: ${remainingRepeats}회)`;
                startSinglePass(item);
            } else {
                isPlaying = false;
                playRepeatBtn.classList.remove("playing");
                statusTextEl.textContent = "";
            }
        });

        function toggleHideMode() {
            isHideMode = !isHideMode;
            syncVisibilityUI();
        }

        function changeSentence(step) {
            const nextIdx = currentIndex + step;
            if (nextIdx >= 0 && nextIdx < sentences.length) {
                currentIndex = nextIdx;
                renderSentence(true);
            }
        }

        renderSentence(false);
    </script>
</body>
</html>
